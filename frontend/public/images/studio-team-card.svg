<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="50%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>
    <radialGradient id="tglow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00E1BA" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#141824" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="tgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="0" cy="0" r="0.75" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" fill="url(#tbg)" />
  <rect width="800" height="360" fill="url(#tglow)" />
  <rect width="800" height="360" fill="url(#tgrid)" />

  <!-- Technical Ambient Frame -->
  <rect x="24" y="24" width="752" height="312" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" stroke-dasharray="6 6" />

  <!-- Top Telemetry Header -->
  <g transform="translate(48, 48)">
    <circle cx="4" cy="4" r="3" fill="#00E1BA" />
    <text x="14" y="8" fill="#00E1BA" font-family="monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.5">
      GEMILANG SQUAD // 6 FULL-STACK ENGINEERS
    </text>
  </g>
  <g transform="translate(680, 48)">
    <text x="70" y="8" text-anchor="end" fill="#64748b" font-family="monospace, monospace" font-size="9" letter-spacing="1">
      STATUS: ACTIVE SPRINT
    </text>
  </g>

  <!-- Center: 6 Squad Engineer Nodes Stacked Horizontally -->
  <g transform="translate(400, 155)">
    <!-- Node 1: Syifa (Lead) -->
    <g transform="translate(-250, 0)">
      <circle cx="0" cy="0" r="28" fill="#121724" stroke="#00E1BA" stroke-width="2" />
      <circle cx="0" cy="-6" r="10" fill="#00E1BA" opacity="0.8" />
      <path d="M -14 20 C -14 7, -8 4, 0 4 C 8 4, 14 7, 14 20 Z" fill="#00E1BA" opacity="0.8" />
      <text x="0" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Syifa P.</text>
      <text x="0" y="55" text-anchor="middle" fill="#00E1BA" font-family="monospace, monospace" font-size="8.5">LEAD / ARCH</text>
    </g>

    <!-- Connector Line 1-2 -->
    <line x1="-222" y1="0" x2="-178" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3" />

    <!-- Node 2: Rangga (Cloud) -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="28" fill="#121724" stroke="#34d399" stroke-width="1.5" />
      <circle cx="0" cy="-6" r="10" fill="#34d399" opacity="0.8" />
      <path d="M -14 20 C -14 7, -8 4, 0 4 C 8 4, 14 7, 14 20 Z" fill="#34d399" opacity="0.8" />
      <text x="0" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Rangga</text>
      <text x="0" y="55" text-anchor="middle" fill="#34d399" font-family="monospace, monospace" font-size="8.5">BACKEND / CLOUD</text>
    </g>

    <!-- Connector Line 2-3 -->
    <line x1="-122" y1="0" x2="-78" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3" />

    <!-- Node 3: Pandu (Frontend) -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="28" fill="#121724" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="0" cy="-6" r="10" fill="#c084fc" opacity="0.8" />
      <path d="M -14 20 C -14 7, -8 4, 0 4 C 8 4, 14 7, 14 20 Z" fill="#c084fc" opacity="0.8" />
      <text x="0" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Pandu</text>
      <text x="0" y="55" text-anchor="middle" fill="#c084fc" font-family="monospace, monospace" font-size="8.5">FRONTEND / UI</text>
    </g>

    <!-- Connector Line 3-4 -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3" />

    <!-- Node 4: Iqbal (Hardware/POS) -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="28" fill="#121724" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="0" cy="-6" r="10" fill="#fbbf24" opacity="0.8" />
      <path d="M -14 20 C -14 7, -8 4, 0 4 C 8 4, 14 7, 14 20 Z" fill="#fbbf24" opacity="0.8" />
      <text x="0" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Iqbal</text>
      <text x="0" y="55" text-anchor="middle" fill="#fbbf24" font-family="monospace, monospace" font-size="8.5">HARDWARE / POS</text>
    </g>

    <!-- Connector Line 4-5 -->
    <line x1="78" y1="0" x2="122" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3" />

    <!-- Node 5: Rizal (Mobile) -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="28" fill="#121724" stroke="#22d3ee" stroke-width="1.5" />
      <circle cx="0" cy="-6" r="10" fill="#22d3ee" opacity="0.8" />
      <path d="M -14 20 C -14 7, -8 4, 0 4 C 8 4, 14 7, 14 20 Z" fill="#22d3ee" opacity="0.8" />
      <text x="0" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Rizal</text>
      <text x="0" y="55" text-anchor="middle" fill="#22d3ee" font-family="monospace, monospace" font-size="8.5">MOBILE APPS</text>
    </g>

    <!-- Connector Line 5-6 -->
    <line x1="178" y1="0" x2="222" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3" />

    <!-- Node 6: Ade Dwi (AI) -->
    <g transform="translate(250, 0)">
      <circle cx="0" cy="0" r="28" fill="#121724" stroke="#fb7185" stroke-width="1.5" />
      <circle cx="0" cy="-6" r="10" fill="#fb7185" opacity="0.8" />
      <path d="M -14 20 C -14 7, -8 4, 0 4 C 8 4, 14 7, 14 20 Z" fill="#fb7185" opacity="0.8" />
      <text x="0" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Ade Dwi</text>
      <text x="0" y="55" text-anchor="middle" fill="#fb7185" font-family="monospace, monospace" font-size="8.5">AI / WORKFLOW</text>
    </g>
  </g>

  <!-- Bottom Command Bar -->
  <g transform="translate(400, 290)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0e131f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" />
    <circle cx="-145" cy="0" r="3.5" fill="#00E1BA" />
    <text x="-130" y="4" fill="#cbd5e1" font-family="monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="1">
      READY SPRINT: WEB • POS • AI • MOBILE
    </text>
  </g>
</svg>
