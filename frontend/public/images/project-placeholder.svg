<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141c" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <radialGradient id="pglow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00E1BA" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#141721" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="pgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="1000" fill="url(#pbg)" />
  <rect width="1600" height="1000" fill="url(#pglow)" />
  <rect width="1600" height="1000" fill="url(#pgrid)" />

  <!-- Technical Bounding Frame -->
  <rect x="70" y="60" width="1460" height="880" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" stroke-dasharray="8 8" rx="20" />
  
  <!-- Corner Crosshairs -->
  <g stroke="#00E1BA" stroke-width="1.5" opacity="0.45">
    <path d="M 50 60 L 90 60 M 70 40 L 70 80" />
    <path d="M 1510 60 L 1550 60 M 1530 40 L 1530 80" />
    <path d="M 50 940 L 90 940 M 70 920 L 70 960" />
    <path d="M 1510 940 L 1550 940 M 1530 920 L 1530 960" />
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(100, 110)">
    <circle cx="0" cy="0" r="4" fill="#00E1BA" />
    <text x="14" y="4" fill="#00E1BA" font-family="monospace, monospace" font-size="12" font-weight="700" letter-spacing="2">
      GEMILANG SPACE // ACTIVE ENGINEERING BUILD
    </text>
  </g>

  <!-- Center Wireframe Layout Window -->
  <g transform="translate(800, 430)">
    <!-- Outer Window Card -->
    <rect x="-180" y="-130" width="360" height="230" rx="16" fill="#10141f" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.14" />
    <!-- Header Bar -->
    <line x1="-180" y1="-85" x2="180" y2="-85" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <circle cx="-150" cy="-108" r="4.5" fill="#ef4444" opacity="0.7" />
    <circle cx="-132" cy="-108" r="4.5" fill="#eab308" opacity="0.7" />
    <circle cx="-114" cy="-108" r="4.5" fill="#22c55e" opacity="0.7" />
    <text x="150" y="-103" text-anchor="end" fill="#64748b" font-family="monospace, monospace" font-size="10">DEV // 2026</text>
    
    <!-- Wireframe Skeletons -->
    <rect x="-150" y="-60" width="130" height="14" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="-150" y="-34" width="90" height="9" rx="3" fill="#ffffff" fill-opacity="0.07" />
    <rect x="-150" y="-12" width="300" height="74" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 4" />
    
    <!-- Code Bracket Icon inside Wireframe -->
    <text x="0" y="32" text-anchor="middle" fill="#00E1BA" font-family="monospace, monospace" font-size="18" opacity="0.4" font-weight="700">&lt; / &gt;</text>
  </g>

  <!-- Center Status Pill -->
  <g transform="translate(800, 640)">
    <!-- Pill Container -->
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#0d1117" stroke="#00E1BA" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Pulse dot -->
    <circle cx="-140" cy="0" r="5" fill="#00E1BA" />
    <!-- Pill Text -->
    <text x="-120" y="5" fill="#f1f5f9" font-family="monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">
      DALAM PENGERJAAN ⚡
    </text>
  </g>

  <!-- Explanatory Subtitle -->
  <text x="800" y="720" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" letter-spacing="0.5">
    Aset visual &amp; antarmuka produksi sedang dibangun oleh squad engineer
  </text>
  <text x="800" y="748" text-anchor="middle" fill="#64748b" font-family="monospace, monospace" font-size="12" letter-spacing="1">
    STAGING // SPRINT AKTIF
  </text>
</svg>
