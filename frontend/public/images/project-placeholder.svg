<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141c" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <radialGradient id="pglow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00E1BA" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#141721" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="pgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="1200" fill="url(#pbg)" />
  <rect width="1600" height="1200" fill="url(#pglow)" />
  <rect width="1600" height="1200" fill="url(#pgrid)" />

  <!-- Technical Bounding Frame -->
  <rect x="80" y="80" width="1440" height="1040" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" stroke-dasharray="8 8" rx="24" />
  
  <!-- Corner Crosshairs -->
  <g stroke="#00E1BA" stroke-width="1.5" opacity="0.4">
    <path d="M 60 80 L 100 80 M 80 60 L 80 100" />
    <path d="M 1500 80 L 1540 80 M 1520 60 L 1520 100" />
    <path d="M 60 1120 L 100 1120 M 80 1100 L 80 1140" />
    <path d="M 1500 1120 L 1540 1120 M 1520 1100 L 1520 1140" />
  </g>

  <!-- Center Wireframe Layout Icon -->
  <g transform="translate(800, 520)" opacity="0.45">
    <!-- Outer Window Card -->
    <rect x="-160" y="-120" width="320" height="220" rx="16" fill="#121622" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" />
    <!-- Header Bar -->
    <line x1="-160" y1="-80" x2="160" y2="-80" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" />
    <circle cx="-135" cy="-100" r="4" fill="#ef4444" opacity="0.6" />
    <circle cx="-120" cy="-100" r="4" fill="#eab308" opacity="0.6" />
    <circle cx="-105" cy="-100" r="4" fill="#22c55e" opacity="0.6" />
    <!-- Wireframe Skeletons -->
    <rect x="-135" y="-55" width="120" height="12" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <rect x="-135" y="-30" width="80" height="8" rx="3" fill="#ffffff" fill-opacity="0.06" />
    <rect x="-135" y="-8" width="270" height="70" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 4" />
  </g>

  <!-- Center Pill: In Development -->
  <g transform="translate(800, 710)">
    <!-- Pill Container -->
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#0d1117" stroke="#00E1BA" stroke-width="1" stroke-opacity="0.3" />
    <!-- Pulse dot -->
    <circle cx="-150" cy="0" r="5" fill="#00E1BA" />
    <!-- Pill Text -->
    <text x="-130" y="4.5" fill="#e2e8f0" font-family="monospace, monospace" font-size="14" font-weight="600" letter-spacing="2">
      DALAM PENGERJAAN ⚡
    </text>
  </g>

  <!-- Subtitle -->
  <text x="800" y="780" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="15" letter-spacing="1">
    Aset visual &amp; antarmuka sedang diproses oleh squad
  </text>
</svg>
